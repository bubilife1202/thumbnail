<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Reelscode">
    <meta name="description" content="유튜브, 인스타그램, 틱톡, 쇼츠를 위한 전문가급 썸네일 생성 도구 - Made by Reelscode">
    <title>프로 썸네일 메이커 - 유튜브, 인스타그램, 틱톡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&family=Jua&family=Nanum+Gothic:wght@700;800&family=Do+Hyeon&family=Anton&family=Bebas+Neue&family=Righteous&family=Staatliches&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 상단 툴바 -->
        <div class="toolbar">
            <div class="toolbar-left">
                <h1>🎨 프로 썸네일 메이커</h1>
                <div class="platform-selector">
                    <button class="platform-quick-btn active" data-platform="youtube" title="유튜브 (1280x720)">
                        <span>▶</span> 유튜브
                    </button>
                    <button class="platform-quick-btn" data-platform="youtube-shorts" title="쇼츠 (1080x1920)">
                        <span>#</span> 쇼츠
                    </button>
                    <button class="platform-quick-btn" data-platform="instagram-post" title="인스타 (1080x1080)">
                        <span>📷</span> 인스타
                    </button>
                    <button class="platform-quick-btn" data-platform="instagram-story" title="스토리 (1080x1920)">
                        <span>📱</span> 스토리
                    </button>
                    <button class="platform-quick-btn" data-platform="tiktok" title="틱톡 (1080x1920)">
                        <span>🎵</span> 틱톡
                    </button>
                </div>
            </div>
            <div class="toolbar-right">
                <button id="undoBtn" class="toolbar-btn" title="실행 취소 (Ctrl+Z)" disabled>
                    ↶ 되돌리기
                </button>
                <button id="redoBtn" class="toolbar-btn" title="다시 실행 (Ctrl+Y)" disabled>
                    ↷ 다시실행
                </button>
                <button id="savePresetBtn" class="toolbar-btn" title="프리셋 저장">
                    💾 저장
                </button>
                <button id="loadPresetBtn" class="toolbar-btn" title="프리셋 불러오기">
                    📂 불러오기
                </button>
                <button id="downloadBtn" class="toolbar-btn primary">
                    📥 다운로드
                </button>
            </div>
        </div>

        <div class="main-container">
            <!-- 왼쪽 패널 -->
            <div class="left-panel">
                <!-- 탭 네비게이션 -->
                <div class="tab-navigation">
                    <button class="tab-btn active" data-tab="templates">템플릿</button>
                    <button class="tab-btn" data-tab="text">텍스트</button>
                    <button class="tab-btn" data-tab="image">이미지</button>
                    <button class="tab-btn" data-tab="shapes">도형</button>
                    <button class="tab-btn" data-tab="effects">효과</button>
                </div>

                <!-- 탭 컨텐츠 -->
                <div class="tab-content">
                    <!-- 템플릿 탭 -->
                    <div class="tab-pane active" data-pane="templates">
                        <h3>빠른 시작</h3>
                        <div class="template-gallery">
                            <div class="template-item" data-template="blank">
                                <div class="template-thumb blank-thumb"></div>
                                <p>빈 캔버스</p>
                            </div>
                            <div class="template-item" data-template="mrbeast">
                                <div class="template-thumb mrbeast-thumb"></div>
                                <p>MrBeast 스타일</p>
                            </div>
                            <div class="template-item" data-template="modern">
                                <div class="template-thumb modern-thumb"></div>
                                <p>모던 그라데이션</p>
                            </div>
                            <div class="template-item" data-template="vibrant">
                                <div class="template-thumb vibrant-thumb"></div>
                                <p>비브런트</p>
                            </div>
                            <div class="template-item" data-template="minimal">
                                <div class="template-thumb minimal-thumb"></div>
                                <p>미니멀</p>
                            </div>
                            <div class="template-item" data-template="dark">
                                <div class="template-thumb dark-thumb"></div>
                                <p>다크 모드</p>
                            </div>
                            <div class="template-item" data-template="neon">
                                <div class="template-thumb neon-thumb"></div>
                                <p>네온 효과</p>
                            </div>
                            <div class="template-item" data-template="sunset">
                                <div class="template-thumb sunset-thumb"></div>
                                <p>선셋</p>
                            </div>
                        </div>

                        <h3>베이스 이미지</h3>
                        <button class="action-btn" id="uploadBaseBtn">📁 이미지 업로드</button>
                        <input type="file" id="baseImageInput" accept="image/*" style="display: none;">
                        <button class="action-btn secondary" id="clearBaseBtn">🗑️ 이미지 제거</button>
                    </div>

                    <!-- 텍스트 탭 -->
                    <div class="tab-pane" data-pane="text">
                        <h3>텍스트 추가</h3>
                        <button class="action-btn" id="addTextBtn">➕ 텍스트 레이어 추가</button>

                        <div id="textControls" style="display: none;">
                            <h3>텍스트 편집</h3>
                            <div class="form-group">
                                <label>내용</label>
                                <input type="text" id="textContent" placeholder="텍스트를 입력하세요">
                            </div>

                            <div class="form-group">
                                <label>폰트</label>
                                <select id="fontFamily">
                                    <option value="'Noto Sans KR', sans-serif">본고딕 (기본)</option>
                                    <option value="'Black Han Sans', sans-serif">검은고딕 (Bold)</option>
                                    <option value="'Jua', sans-serif">주아체</option>
                                    <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
                                    <option value="'Do Hyeon', sans-serif">도현체</option>
                                    <option value="'Anton', sans-serif">Anton (영문)</option>
                                    <option value="'Bebas Neue', sans-serif">Bebas Neue (영문)</option>
                                    <option value="'Righteous', sans-serif">Righteous (영문)</option>
                                    <option value="'Staatliches', sans-serif">Staatliches (영문)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>크기 <span id="fontSizeDisplay">80px</span></label>
                                <input type="range" id="fontSize" min="20" max="200" value="80">
                            </div>

                            <div class="form-group">
                                <label>색상</label>
                                <input type="color" id="textColor" value="#ffffff">
                            </div>

                            <h4>스타일 프리셋</h4>
                            <div class="style-presets">
                                <button class="preset-btn" data-preset="none">기본</button>
                                <button class="preset-btn" data-preset="outline">아웃라인</button>
                                <button class="preset-btn" data-preset="shadow">그림자</button>
                                <button class="preset-btn" data-preset="glow">네온 글로우</button>
                                <button class="preset-btn" data-preset="bg">배경 박스</button>
                            </div>

                            <div class="advanced-controls">
                                <div class="form-group">
                                    <label>테두리 두께</label>
                                    <input type="range" id="strokeWidth" min="0" max="20" value="0">
                                    <span id="strokeWidthDisplay">0px</span>
                                </div>
                                <div class="form-group">
                                    <label>테두리 색상</label>
                                    <input type="color" id="strokeColor" value="#000000">
                                </div>
                                <div class="form-group">
                                    <label>그림자 크기</label>
                                    <input type="range" id="shadowBlur" min="0" max="50" value="0">
                                    <span id="shadowBlurDisplay">0px</span>
                                </div>
                                <div class="form-group">
                                    <label>그림자 색상</label>
                                    <input type="color" id="shadowColor" value="#000000">
                                </div>
                                <div class="form-group">
                                    <label>
                                        <input type="checkbox" id="textBackground">
                                        배경 박스
                                    </label>
                                </div>
                                <div class="form-group">
                                    <label>배경 색상</label>
                                    <input type="color" id="bgBoxColor" value="#000000">
                                </div>
                                <div class="form-group">
                                    <label>배경 투명도</label>
                                    <input type="range" id="bgBoxOpacity" min="0" max="100" value="70">
                                    <span id="bgBoxOpacityDisplay">70%</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 이미지 탭 -->
                    <div class="tab-pane" data-pane="image">
                        <h3>이미지 추가</h3>
                        <button class="action-btn" id="addImageBtn">📁 이미지 업로드</button>
                        <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">

                        <h3>스티커</h3>
                        <div class="sticker-grid" id="stickerGrid">
                            <div class="sticker-item" data-emoji="⭐">⭐</div>
                            <div class="sticker-item" data-emoji="🔥">🔥</div>
                            <div class="sticker-item" data-emoji="💯">💯</div>
                            <div class="sticker-item" data-emoji="✨">✨</div>
                            <div class="sticker-item" data-emoji="👍">👍</div>
                            <div class="sticker-item" data-emoji="❤️">❤️</div>
                            <div class="sticker-item" data-emoji="😱">😱</div>
                            <div class="sticker-item" data-emoji="😍">😍</div>
                            <div class="sticker-item" data-emoji="🎉">🎉</div>
                            <div class="sticker-item" data-emoji="🚀">🚀</div>
                            <div class="sticker-item" data-emoji="💰">💰</div>
                            <div class="sticker-item" data-emoji="⚡">⚡</div>
                            <div class="sticker-item" data-emoji="🎯">🎯</div>
                            <div class="sticker-item" data-emoji="💎">💎</div>
                            <div class="sticker-item" data-emoji="👀">👀</div>
                            <div class="sticker-item" data-emoji="🔔">🔔</div>
                        </div>

                        <div id="imageControls" style="display: none;">
                            <h3>이미지 설정</h3>
                            <div class="form-group">
                                <label>크기 <span id="imageSizeDisplay">200px</span></label>
                                <input type="range" id="imageSize" min="50" max="800" value="200">
                            </div>
                            <div class="form-group">
                                <label>회전 <span id="imageRotationDisplay">0°</span></label>
                                <input type="range" id="imageRotation" min="0" max="360" value="0">
                            </div>
                            <div class="form-group">
                                <label>투명도 <span id="imageOpacityDisplay">100%</span></label>
                                <input type="range" id="imageOpacity" min="0" max="100" value="100">
                            </div>
                        </div>
                    </div>

                    <!-- 도형 탭 -->
                    <div class="tab-pane" data-pane="shapes">
                        <h3>도형 추가</h3>
                        <div class="shape-grid">
                            <button class="shape-btn" data-shape="rectangle">
                                <div class="shape-icon rect"></div>
                                사각형
                            </button>
                            <button class="shape-btn" data-shape="circle">
                                <div class="shape-icon circle"></div>
                                원
                            </button>
                            <button class="shape-btn" data-shape="triangle">
                                <div class="shape-icon triangle"></div>
                                삼각형
                            </button>
                            <button class="shape-btn" data-shape="arrow">
                                <div class="shape-icon arrow"></div>
                                화살표
                            </button>
                        </div>

                        <div id="shapeControls" style="display: none;">
                            <h3>도형 설정</h3>
                            <div class="form-group">
                                <label>채우기 색상</label>
                                <input type="color" id="shapeFillColor" value="#ff0000">
                            </div>
                            <div class="form-group">
                                <label>테두리 색상</label>
                                <input type="color" id="shapeStrokeColor" value="#000000">
                            </div>
                            <div class="form-group">
                                <label>테두리 두께</label>
                                <input type="range" id="shapeStrokeWidth" min="0" max="20" value="0">
                                <span id="shapeStrokeWidthDisplay">0px</span>
                            </div>
                            <div class="form-group">
                                <label>크기 <span id="shapeSizeDisplay">200px</span></label>
                                <input type="range" id="shapeSize" min="50" max="600" value="200">
                            </div>
                            <div class="form-group">
                                <label>회전 <span id="shapeRotationDisplay">0°</span></label>
                                <input type="range" id="shapeRotation" min="0" max="360" value="0">
                            </div>
                        </div>
                    </div>

                    <!-- 효과 탭 -->
                    <div class="tab-pane" data-pane="effects">
                        <h3>이미지 필터</h3>
                        <div class="form-group">
                            <label>밝기 <span id="brightnessDisplay">100%</span></label>
                            <input type="range" id="brightness" min="0" max="200" value="100">
                        </div>
                        <div class="form-group">
                            <label>대비 <span id="contrastDisplay">100%</span></label>
                            <input type="range" id="contrast" min="0" max="200" value="100">
                        </div>
                        <div class="form-group">
                            <label>채도 <span id="saturationDisplay">100%</span></label>
                            <input type="range" id="saturation" min="0" max="200" value="100">
                        </div>
                        <div class="form-group">
                            <label>블러 <span id="blurDisplay">0px</span></label>
                            <input type="range" id="blur" min="0" max="20" value="0">
                        </div>

                        <h3>필터 프리셋</h3>
                        <div class="filter-presets">
                            <button class="preset-btn" data-filter="none">없음</button>
                            <button class="preset-btn" data-filter="vintage">빈티지</button>
                            <button class="preset-btn" data-filter="bw">흑백</button>
                            <button class="preset-btn" data-filter="warm">따뜻하게</button>
                            <button class="preset-btn" data-filter="cool">차갑게</button>
                            <button class="preset-btn" data-filter="high-contrast">고대비</button>
                        </div>

                        <h3>캔버스 배경</h3>
                        <div class="form-group">
                            <label>배경 타입</label>
                            <select id="bgType">
                                <option value="color">단색</option>
                                <option value="gradient">그라데이션</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>색상 1</label>
                            <input type="color" id="bgColor1" value="#6366f1">
                        </div>
                        <div class="form-group" id="bgColor2Group">
                            <label>색상 2</label>
                            <input type="color" id="bgColor2" value="#8b5cf6">
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="borderToggle">
                                테두리 추가
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 중앙 캔버스 -->
            <div class="canvas-area">
                <div class="canvas-wrapper">
                    <canvas id="mainCanvas"></canvas>
                    <div id="dragOverlay"></div>
                </div>
                <div class="canvas-info">
                    <span id="canvasSizeInfo">1280 x 720 px</span>
                    <span id="selectedInfo"></span>
                </div>
            </div>

            <!-- 오른쪽 레이어 패널 -->
            <div class="right-panel">
                <h3>레이어</h3>
                <div id="layerList" class="layer-list">
                    <div class="layer-empty">레이어가 없습니다</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>Made with ❤️ by <a href="https://reelscode.com" target="_blank" rel="noopener noreferrer">Reelscode</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
